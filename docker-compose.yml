# Local MongoDB single-node replica set (Prisma requires a replica set for MongoDB).
# Matches DATABASE_URL in backend/.env.example:
#   mongodb://127.0.0.1:27018/texan_website_checker?replicaSet=rs0&directConnection=true
services:
  mongo:
    image: mongo:8.0
    container_name: texan-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it is PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
